,15);fire.position.set(0,3,5);G.add(fire);let P=new T.Group;P.position.set(0,0,9);S.add(P);let body=box(1,1.8,.7,0x89939e);body.position.y=1.1;P.add(body);let head=M(new T.SphereGeometry(.48,12,8),0xc3a48c);head.position.y=2.3;P.add(head);let aura=M(new T.RingGeometry(.9,1.15,24),0x9164ff);aura.rotation.x=-Math.PI/2;aura.position.y=.05;aura.material.transparent=true;aura.material.opacity=.35;P.add(aura);function enemy(x,z){let g=new T.Group;g.position.set(x,0,z);let b=box(1.1,2,.9,0x281c2f);b.position.y=1;g.add(b);let e=M(new T.SphereGeometry(.12,8,8),0xff365f);e.position.set(0,1.45,.5);g.add(e);S.add(g);ens.push({g,hp:4,st:0,cd:0,alive:1})}for(let i=0;i<16;i++){let a=Math.random()*6.28,r=18+Math.random()*48;enemy(Math.cos(a)*r,Math.sin(a)*r)}let hp=100,ju=100,st=100,xp=0,lv=1,wood=0,stone=0,inv=0,ac=0,dc=0,wc=0,qc=0,uc=0,ifr=0,wb=0,keys={},joy={x:0,y:0},mouse={down:0};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.repeat)return;if(e.key==='Shift')dash();if(e.key===' ')bounce();if(e.key.toLowerCase()==='e')gather();if(e.key.toLowerCase()==='q')juju();if(e.key.toLowerCase()==='f')wall();if(e.key.toLowerCase()==='r')ult()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);addEventListener('mousedown',()=>mouse.down=1);addEventListener('mouseup',()=>mouse.down=0);function near(n){let b=null,d=n;for(let e of ens)if(e.alive){let x=e.g.position.distanceTo(P.position);if(x<d){d=x;b=e}}return b}function burst(p,c=0x9a70ff,n=12){for(let i=0;i<n;i++){let m=M(new T.SphereGeometry(.07,6,6),c);m.position.copy(p);S.add(m);parts.push({m,v:new T.Vector3((Math.random()-.5)*5,Math.random()*4,(Math.random()-.5)*5),l:.5})}}function kill(e){e.alive=0;e.g.visible=0;xp+=35;hp=Math.min(100,hp+12);ju=Math.min(100,ju+18);burst(e.g.position,0x9a64ff,20);if(xp>=lv*100){xp-=lv*100;lv++;hp=100;ju=100}}function attack(){if(ac>0)return;ac=.38;let e=near(5.5);if(e){e.hp-=1.7;e.st=.25;burst(e.g.position,0xd8dce0,8);if(e.hp<=0)kill(e)}}function juju(){if(qc>0||ju<22)return;qc=.7;ju-=22;let e=near(9);if(e){e.hp-=3.2;e.st=.5;burst(e.g.position,0xb47cff,24);if(e.hp<=0)kill(e)}else burst(P.position.clone().add(new T.Vector3(0,1,0)),0xb47cff,16)}function wall(){if(wc>0||ju<12)return;wc=1;ju-=12;let w=box(3,.2,.35,0x8056db);w.position.copy(P.position);w.position.y=1.7;w.rotation.y=P.rotation.y;S.add(w);burst(w.position,0xa878ff,12);setTimeout(()=>S.remove(w),900)}function dash(){if(dc>0||st<30)return;dc=.8;st-=30;ifr=.3;let d=new T.Vector3((keys.d?1:0)-(keys.a?1:0),0,(keys.s?1:0)-(keys.w?1:0));if(!d.length())d.set(0,0,-1).applyAxisAngle(new T.Vector3(0,1,0),P.rotation.y);P.position.addScaledVector(d.normalize(),5);burst(P.position,0xa27aff,15)}function bounce(){if(wb>0||st<18)return;wb=.22;st-=18;let d=new T.Vector3((keys.d?1:0)-(keys.a?1:0),0,(keys.s?1:0)-(keys.w?1:0));if(d.length())P.position.addScaledVector(d.normalize(),3.8);burst(P.position,0xbfc2ca,8)}function gather(){let b=null,d=3.3;for(let r of res)if(r.alive){let x=r.g.position.distanceTo(P.position);if(x<d){d=x;b=r}}if(!b)return;b.hp--;burst(b.g.position,b.t==='wood'?0x8d603f:0x7c8086,7);if(b.hp<=0){b.alive=0;b.g.visible=0;if(b.t==='wood')wood+=3;else stone+=3;inv=Math.min(50,inv+3);setTimeout(()=>{b.hp=3;b.alive=1;b.g.visible=1},7000)}}function ult(){if(uc>0||ju<60)return;uc=8;ju-=60;ifr=.8;burst(P.position,0xc79cff,55);for(let e of ens)if(e.alive&&e.g.position.distanceTo(P.position)<14){e.hp-=5;e.st=1;if(e.hp<=0)kill(e)}}let stick=document.getElementById('stick'),nub=document.getElementById('nub');stick?.addEventListener('touchmove',e=>{let t=e.touches[0],r=stick.getBoundingClientRect(),x=t.clientX-r.left-r.width/2,y=t.clientY-r.top-r.height/2,m=Math.min(45,Math.hypot(x,y)),a=Math.atan2(y,x);joy.x=Math.cos(a)*m/45;joy.y=Math.sin(a)*m/45;nub.style.transform=`translate(${joy.x*40}px,${joy.y*40}px)`},{passive:false});stick?.addEventListener('touchend',()=>{joy.x=joy.y=0;nub.style.transform='' });[['a',attack],['d',dash],['q',juju],['w',wall],['r',ult]].forEach(([id,f])=>document.getElementById(id)?.addEventListener('touchstart',e=>{e.preventDefault();f()},{passive:false}));let last=performance.now();function tick(t){let dt=Math.min(.033,(t-last)/1000);last=t;ac=Math.max(0,ac-dt);dc=Math.max(0,dc-dt);wc=Math.max(0,wc-dt);qc=Math.max(0,qc-dt);uc=Math.max(0,uc-dt);ifr=Math.max(0,ifr-dt);wb=Math.max(0,wb-dt);st=Math.min(100,st+24*dt);ju=Math.min(100,ju+5*dt);let mx=(keys.d?1:0)-(keys.a?1:0)+joy.x,my=(keys.s?1:0)-(keys.w?1:0)+joy.y,m=new T.Vector3(mx,0,my);if(m.length()>1)m.normalize();P.position.addScaledVector(m,7*dt);if(m.length()>.05)P.rotation.y=Math.atan2(-m.x,-m.z);if(mouse.down)attack();for(let e of ens)if(e.alive){e.cd=Math.max(0,e.cd-dt);e.st=Math.max(0,e.st-dt);let d=e.g.position.distanceTo(P.position);if(d<22){let v=P.position.clone().sub(e.g.position);v.y=0;if(d>2.1)e.g.position.addScaledVector(v.normalize(),(e.st?.35:1.15)*dt);else if(e.cd<=0&&ifr<=0){e.cd=1.1;hp-=8;burst(P.position,0xff4d68,7);if(hp<=0){hp=100;P.position.set(0,0,9)}}}}for(let i=parts.length-1;i>=0;i--){let p=parts[i];p.l-=dt;p.m.position.addScaledVector(p.v,dt);p.v.y-=8*dt;if(p.l<=0){S.remove(p.m);parts.splice(i,1)}}let target=new T.Vector3(P.position.x,2.2,P.position.z),off=new T.Vector3(0,4.8,7.5).applyAxisAngle(new T.Vector3(0,1,0),P.rotation.y);C.position.lerp(target.clone().add(off),.12);C.lookAt(target);document.getElementById('h').style.width=hp+'%';document.getElementById('j').style.width=ju+'%';document.getElementById('s').style.width=st+'%';document.getElementById('lvl').textContent=`Lv ${lv} · XP ${xp}/${lv*100}`;document.getElementById('wood').textContent=wood;document.getElementById('stone').textContent=stone;document.getElementById('inv').textContent=inv;R.render(S,C);requestAnimationFrame(tick)}requestAnimationFrame(tick);addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});</script></body></html>
